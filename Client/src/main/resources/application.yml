spring:
  application:
    name: AgentClient

server:
  port: 8083

agent-client:
  # 客户端唯一标识，注册工具和发起对话时都使用它
  client-id: agent-client
  # 终端用户标识（多用户隔离）；单用户演示固定为 demo-user
  end-user-id: demo-user
  # 中间件地址
  middleware-url: http://localhost:8080
  # 本客户端对外地址，供中间件回调执行工具。
  # 默认跟随 server.port，避免改了端口却忘了改回调地址，导致网关回调到旧进程。
  callback-base-url: http://localhost:${server.port:8082}
  # 注入给 Agent 的客户端定制系统提示词
  client-prompt: 客户端定制化system prompt
  # 注册失败后的重试间隔
  register-retry-ms: 5000

# 移动端客户端模拟（MOBILE 类型）：无公网回调地址，工具调用走 WebSocket
agent-mobile:
  # 移动端客户端唯一标识（与 SERVER 客户端区分，便于两条链路并存）
  client-id: agent-mobile-client
  # 终端用户标识，中间件按它做用户级隔离，保证工具调用不串到其他用户设备
  end-user-id: demo-user
  # 设备标识，多设备排查用
  device-id: demo-phone
  # 中间件 WebSocket 端点
  ws-url: ws://localhost:8080/ws/agent
  # 注入给 Agent 的移动端定制系统提示词
  client-prompt: 移动端客户端定制化system prompt
  # 注册/连接失败后的重试间隔
  retry-ms: 5000
