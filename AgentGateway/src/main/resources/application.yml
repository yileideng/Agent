spring:
  application:
    name: ClientAgent

agent:
  # 调用接口未传 agent 参数时使用的默认适配器：self(自研Agent服务) / cli / coze
  default-adaptor: self
  # 默认客户端(租户)：/chat、/mcp 未显式指定 clientId 时使用
  default-client-id: agent-client
  # 自研Agent服务(独立模块 AgentBrain)的HTTP接入配置，中间件通过它做决策请求
  self:
    url: http://localhost:8081
    chat-path: /v1/brain/chat
    # 单轮对话内允许的客户端工具调用最大轮数
    max-steps: 5
  # 客户端工具调用的默认超时（毫秒）
  tool:
    timeout-ms: 60000
  # 会话状态由中间件持有，按 (adaptor, clientId, endUserId, sessionId) 隔离，带TTL清理
  session:
    ttl-minutes: 120
    cleanup-interval-ms: 600000
  # 移动端客户端通过 WebSocket(/ws/agent) 接收工具调用，这里是等待其回传结果的超时时间
  ws:
    tool-timeout-ms: 60000
  cli:
    # 当前按 Qwen Code 的参数构造；换 Claude Code 需调整认证参数与 mcp-config 格式
    # qwen 需 Node20+，本机默认 node 是16，因此显式指定 shim 与 Node22 目录
    command: 'D:\nodejs\node_global\qwen.cmd'
    node-path: 'D:\nvm\v22.14.0'
    # 非交互鉴权：走阿里云百炼 OpenAI 兼容端点
    auth-type: openai
    api-key: sk-7aee717a3e024c4aa6ad8d87087d5d48
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    # 外部客户端工具的MCP服务基地址，CLI实际使用 {mcp-url}/{clientId}，只能看到当前客户端的工具
    mcp-url: http://localhost:8080/mcp
    mcp-server-name: client-tools
    # 单次CLI调用超时，超时后强制终止进程
    timeout-seconds: 180
    # 请求 CLI 输出 partial messages，否则 stream-json 可能只在结束时给整段回答
    include-partial-messages: true
    # 追加到CLI系统提示词的语言约束（CLI默认系统提示词为英文）
    language-prompt: 请始终使用简体中文回答用户，不要输出英文。
    # CLI每会话工作目录根路径，留空则使用系统临时目录下的 client-agent-workspaces
    work-dir: ''

  # Codex app-server 独立适配器；不影响现有 cli(Qwen Code)
  codex:
    # 本机 exe 绝对路径或 PATH 中的 codex；未安装时目录中标记不可用
    command: ${AGENT_CODEX_COMMAND:codex}
    # IDE 直接启动也使用已验证的本机 provider/model；仍可由环境变量覆盖
    model: ${AGENT_CODEX_MODEL:gpt-6.1-sol}
    model-provider: ${AGENT_CODEX_MODEL_PROVIDER:magpie}
    mcp-url: ${AGENT_CODEX_MCP_URL:http://127.0.0.1:8080/mcp}
    timeout-seconds: ${AGENT_CODEX_TIMEOUT_SECONDS:180}
    work-dir: ${AGENT_CODEX_WORK_DIR:}
    language-prompt: 请始终使用简体中文回答用户，不要输出英文。

  # ACP Agent 接入（当前用 Qwen Code --acp 验证）
  acp:
    qwen:
      # 默认关闭；验证时通过环境变量/启动参数打开
      enabled: false
      id: qwen-acp
      command: 'D:\nodejs\node_global\qwen.cmd'
      node-path: 'D:\nvm\v22.14.0'
      auth-type: openai
      # 不要把 key 写进仓库；启动时用 AGENT_ACP_API_KEY 注入
      api-key: ${AGENT_ACP_API_KEY:}
      base-url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
      model: qwen-plus
      mcp-url: 'http://localhost:8080/mcp'
      mcp-server-name: client-tools
      # 标准路径走 session/new.mcpServers；Qwen 0.26 ACP 有 MCP 工具不进入模型工具表的已知问题。
      # true 会改用 --mcp-config + alwaysLoadTools 实验路径，当前未验证能绕过该问题。
      use-mcp-config-file: false
      work-dir: ''
      # 默认要求 Qwen 审批；本地验证可临时设为 yolo（会自动放行工具）
      approval-mode: default
      timeout-seconds: 180

# 扣子适配器配置（未使用时可留空）
coze:
  api-token: ''
  bot-id: ''
  base-url: https://api.coze.cn
