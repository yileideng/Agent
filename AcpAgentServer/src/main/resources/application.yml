spring:
  application:
    name: AcpAgentServer

server:
  port: 8095

gateway:
  # Gateway 地址；启动后自动注册，失败最多重试 3 次
  admin-url: 'http://localhost:8080'
  auto-register: true

agent:
  id: 'local-ws-qwen'
  # 必须是 Gateway 能访问到的地址；同机测试可用 localhost
  public-ws-url: 'ws://localhost:8095/acp'

qwen:
  # 本地 Qwen Code CLI；真实外部 Agent 由外部服务自己提供
  command: 'D:\nodejs\node_global\qwen.cmd'
  node-path: 'D:\nvm\v22.14.0'
  auth-type: openai
  # demo 直接复用 Gateway 的 key；生产应改用环境变量/密钥管理
  api-key: 'sk-7aee717a3e024c4aa6ad8d87087d5d48'
  base-url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
  model: qwen-plus
  approval-mode: default

logging:
  level:
    root: INFO