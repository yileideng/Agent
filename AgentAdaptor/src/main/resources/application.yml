spring:
  application:
    name: ClientAgent

agent:
  # 调用接口未传 agent 参数时使用的默认适配器：self(自研Agent服务) / cli / coze
  default-adaptor: self
  # 默认客户端(租户)：/chat、/mcp 未显式指定 clientId 时使用
  default-client-id: agent-client
  # 自研Agent服务(独立模块 AgentBrain)的HTTP接入配置，中间件通过它做决策请求
  self:
    url: http://localhost:8081
    chat-path: /v1/brain/chat
    # 单轮对话内允许的客户端工具调用最大轮数
    max-steps: 5
  # 客户端工具调用的默认超时（毫秒）
  tool:
    timeout-ms: 60000
  # 会话状态由中间件持有，按 (adaptor, clientId, endUserId, sessionId) 隔离，带TTL清理
  session:
    ttl-minutes: 120
    cleanup-interval-ms: 600000
  # 移动端客户端通过 WebSocket(/ws/agent) 接收工具调用，这里是等待其回传结果的超时时间
  ws:
    tool-timeout-ms: 60000
  cli:
    # qwen 需 Node20+，本机默认 node 是16，因此显式指定 shim 与 Node22 目录
    command: 'D:\nodejs\node_global\qwen.cmd'
    node-path: 'D:\nvm\v22.14.0'
    # 非交互鉴权：走阿里云百炼 OpenAI 兼容端点
    auth-type: openai
    api-key: sk-7aee717a3e024c4aa6ad8d87087d5d48
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    # 外部客户端工具的MCP服务基地址，CLI实际使用 {mcp-url}/{clientId}，只能看到当前客户端的工具
    mcp-url: http://localhost:8080/mcp
    mcp-server-name: client-tools
    # 单次CLI调用超时，超时后强制终止进程
    timeout-seconds: 180
    # 追加到CLI系统提示词的语言约束（CLI默认系统提示词为英文）
    language-prompt: 请始终使用简体中文回答用户，不要输出英文。
    # CLI每会话工作目录根路径，留空则使用系统临时目录下的 client-agent-workspaces
    work-dir: ''

# 扣子适配器配置（未使用时可留空）
coze:
  api-token: ''
  bot-id: ''
  base-url: https://api.coze.cn
